# 2 nodes x 8 GPUs of distributed training. Submit with:
#   gpu submit examples/multi-node-training.yaml
name: llama-8b-sft
team: team-alpha
project: llm-sft
experiment: exp-042
image: nvcr.io/nvidia/pytorch:24.10-py3
command:
  - /bin/sh
  - -c
  - >-
    torchrun --nnodes=$NNODES --nproc-per-node=$NPROC_PER_NODE --node-rank=$NODE_RANK
    --master-addr=$MASTER_ADDR --master-port=$MASTER_PORT
    train.py --resume-from $CHECKPOINT_DIR
gpus: 16
max_runtime: 12h
checkpoint_dir: s3://team-alpha-ml/checkpoints/exp-042
data: [s3://team-alpha-ml/datasets/sft-v3]
