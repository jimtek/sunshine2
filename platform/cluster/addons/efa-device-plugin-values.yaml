tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: platform.gpu/pool
    operator: Exists
    effect: NoSchedule
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: platform.gpu/pool
              operator: Exists
