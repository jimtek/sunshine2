# The EKS AL2023 NVIDIA AMI ships the driver and container toolkit, so the
# operator only runs the device plugin, feature discovery and DCGM exporter.
driver:
  enabled: false
toolkit:
  enabled: false
devicePlugin:
  enabled: true
gfd:
  enabled: true
dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
    # Keep pod/namespace of the workload using each GPU (for per-experiment metrics).
    honorLabels: true
migManager:
  enabled: false
daemonsets:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: platform.gpu/pool
      operator: Exists
      effect: NoSchedule
node-feature-discovery:
  worker:
    tolerations:
      - operator: Exists
