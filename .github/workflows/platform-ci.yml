name: platform-ci

on:
  push:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]

jobs:
  fleetops:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/tools/fleetops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: fleetops --config ../../config/fleet-defaults.yaml check-config

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive platform/terraform
      - run: terraform init -backend=false && terraform validate
        working-directory: platform/terraform/live/phase0
